services:
  postgres:
    image: postgres:17
    container_name: eventu-postgres
    env_file:
      - .env.docker
    restart: "always"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: eventu-backend
    ports:
      - "8001:8000"
    env_file:
      - .env.docker
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: